      - name: Validate sitemap XML and static HTML integrity
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          root = Path('.')
          errors = []
          base_ref = os.environ.get('GITHUB_BASE_REF', 'main')
          try:
              changed = subprocess.check_output(['git','diff','--name-only',f'origin/{base_ref}...HEAD'], text=True).splitlines()
          except Exception:
              changed = []
          changed_html = {Path(p) for p in changed if p.endswith('.html')}

          sitemap = root / 'sitemap.xml'
          prefix = 'https://site-solutions-pro.github.io/wellmax/'
          try:
              tree = ET.parse(sitemap)
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
              locs = [el.text.strip() for el in tree.findall('.//sm:loc', ns) if el.text]
              if len(locs) != len(set(locs)):
                  errors.append('sitemap.xml contains duplicate <loc> entries')
              sitemap_targets = set()
              for url in locs:
                  if not url.startswith('https://'):
                      errors.append(f'non-HTTPS sitemap URL: {url}')
                  if not url.startswith(prefix):
                      errors.append(f'sitemap URL outside production base {prefix}: {url}')
                      continue
                  rel = unquote(url[len(prefix):])
                  target = root / rel
                  if rel == '' or rel.endswith('/'):
                      target = target / 'index.html'
                  if not target.is_file():
                      errors.append(f'sitemap target missing: {url} -> {target}')
                  else:
                      sitemap_targets.add(target.resolve())
          except Exception as exc:
              errors.append(f'sitemap.xml parse failure: {exc}')
              locs = []
              sitemap_targets = set()

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()
                  self.jsonld = []
                  self._jsonld = False
                  self._buf = []
                  self.title_count = 0
                  self.h1_count = 0
                  self.canonicals = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      self.ids.add(a['id'])
                  if tag == 'a' and 'href' in a:
                      self.links.append(a['href'])
                  if tag in ('script','link','img'):
                      key = {'script':'src','link':'href','img':'src'}[tag]
                      if a.get(key):
                          self.links.append(a[key])
                  if tag == 'script' and a.get('type') == 'application/ld+json':
                      self._jsonld = True
                      self._buf = []
                  if tag == 'title': self.title_count += 1
                  if tag == 'h1': self.h1_count += 1
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonicals += 1
              def handle_endtag(self, tag):
                  if tag == 'script' and self._jsonld:
                      self._jsonld = False
                      self.jsonld.append(''.join(self._buf))
              def handle_data(self, data):
                  if self._jsonld: self._buf.append(data)

          html_files = sorted(root.rglob('*.html'))
          public_html = {path.resolve() for path in html_files}
          for path in sorted(public_html - sitemap_targets):
              errors.append(f'public HTML missing from sitemap.xml: {path.relative_to(root.resolve())}')
          for path in sorted(sitemap_targets - public_html):
              errors.append(f'sitemap target is not public HTML: {path.relative_to(root.resolve())}')

          expected_robots_sitemap = f'Sitemap: {prefix}sitemap.xml'
          robots_lines = [line.strip() for line in (root / 'robots.txt').read_text(encoding='utf-8').splitlines()]
          robots_sitemaps = [line for line in robots_lines if line.lower().startswith('sitemap:')]
          if robots_sitemaps != [expected_robots_sitemap]:
              errors.append(
                  f'robots.txt must contain exactly {expected_robots_sitemap!r}; found {robots_sitemaps!r}'
              )

          # Historical and migration documentation is intentionally excluded.
          # Active browser-delivered source must never point to the retired project URL.
          stale_production_url = 'site-solutions-pro.github.io/pepeducation/'
          active_files = [root / 'robots.txt', root / 'sitemap.xml', *html_files]
          active_files.extend(
              path for path in (root / 'assets').rglob('*')
              if path.is_file() and path.suffix.lower() in {'.css', '.js', '.svg'}
          )
          for path in active_files:
              if stale_production_url in path.read_text(encoding='utf-8'):
                  errors.append(f'active production file contains retired URL: {path}')

          parsed = {}
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              p = Parser()
              try:
                  p.feed(text)
              except Exception as exc:
                  errors.append(f'{path}: HTML parser failure: {exc}')
                  continue
              parsed[path] = p

              dynamic_shell = 'assets/i18n-page.js' in text
              strict = not dynamic_shell and (
                  path in changed_html or (path.parent == Path('pt') and path.name != 'index.html')
              )
              if strict:
                  # Preserve strict checks for new/compliant pages while allowing a
                  # scoped UI change to leave documented legacy metadata debt unchanged.
                  baseline = None
                  baseline_parser = None
                  if path in changed_html:
                      try:
                          baseline = subprocess.check_output(
                              ['git', 'show', f'origin/{base_ref}:{path.as_posix()}'],
                              text=True,
                              encoding='utf-8'
                          )
                          baseline_parser = Parser()
                          baseline_parser.feed(baseline)
                      except Exception:
                          baseline = None
                          baseline_parser = None

                  doctype_valid = text.lstrip().startswith('<!DOCTYPE html>')
                  baseline_doctype_valid = baseline is not None and baseline.lstrip().startswith('<!DOCTYPE html>')
                  if not doctype_valid and (baseline is None or baseline_doctype_valid):
                      errors.append(f'{path}: missing canonical HTML5 doctype')
                  if p.title_count != 1 and (baseline_parser is None or baseline_parser.title_count == 1):
                      errors.append(f'{path}: expected exactly one <title>, found {p.title_count}')
                  if p.h1_count != 1 and (baseline_parser is None or baseline_parser.h1_count == 1):
                      errors.append(f'{path}: expected exactly one <h1>, found {p.h1_count}')
                  if p.canonicals != 1 and (baseline_parser is None or baseline_parser.canonicals == 1):
                      errors.append(f'{path}: expected exactly one canonical link, found {p.canonicals}')

              for block in p.jsonld:
                  try:
                      json.loads(block)
                  except Exception as exc:
                      errors.append(f'{path}: invalid JSON-LD: {exc}')

          for path, p in parsed.items():
              base = path.parent
              for href in p.links:
                  if not href or href.startswith(('http://','https://','mailto:','tel:','javascript:','data:')):
                      continue
                  if href.startswith('#'):
                      frag = href[1:]
                      if frag and frag not in p.ids:
                          errors.append(f'{path}: missing fragment target #{frag}')
                      continue
                  clean = href.split('#',1)[0].split('?',1)[0]
                  if not clean:
                      continue
                  target = (base / clean).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f'{path}: local link escapes repository: {href}')
                      continue
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{path}: missing local target {href}')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              raise SystemExit(1)
          print(f'Validated {len(html_files)} HTML files, {len(changed_html)} changed HTML files and {len(locs)} sitemap URLs successfully.')
          PY

