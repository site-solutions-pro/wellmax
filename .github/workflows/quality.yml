name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate WellMax agent governance contracts
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const requiredFiles = [
            'AGENTS.md',
            'pt/AGENTS.md',
            'es/AGENTS.md',
            'peptides/AGENTS.md',
            'supplements/AGENTS.md',
            'biomarkers/AGENTS.md',
            'docs/WELLMAX_CONSTITUTION.md',
            'docs/AGENT_ARCHITECTURE.md',
            'docs/SCIENTIFIC_STANDARD.md',
            'docs/SEO_STANDARD.md',
            'docs/I18N_STANDARD.md',
            'docs/UX_STANDARD.md',
            'docs/QA_STANDARD.md',
            'docs/RELEASE_STANDARD.md',
            'docs/CONTENT_PAGE_CONTRACT.md',
            'docs/CONTENT_MANIFEST_STANDARD.md',
            'docs/CONTENT_STATUS_REPORT.md',
            'docs/ROADMAP.md'
          ];

          for (const file of requiredFiles) {
            assert.ok(fs.existsSync(file), `missing governance contract: ${file}`);
            assert.ok(fs.readFileSync(file, 'utf8').trim().length > 100, `empty governance contract: ${file}`);
          }

          const root = fs.readFileSync('AGENTS.md', 'utf8');
          assert.ok(root.includes('site-solutions-pro/wellmax'), 'repository identity missing from AGENTS.md');
          assert.ok(
            root.includes('https://site-solutions-pro.github.io/wellmax/'),
            'production base missing from AGENTS.md'
          );
          assert.ok(
            root.includes('BUILD -> QA -> SEO/I18N -> SUPERVISOR -> HUMAN MERGE'),
            'required agent handoff sequence missing'
          );

          const architecture = fs.readFileSync('docs/AGENT_ARCHITECTURE.md', 'utf8');
          const roles = [
            'WellMax Supervisor',
            'Architecture Agent',
            'Scientific Content Agent',
            'SEO & i18n Agent',
            'QA Agent',
            'UX Agent',
            'Release Agent'
          ];
          const requiredRoleFields = [
            '### Mission',
            '### Responsibilities',
            '### Permitted autonomous actions',
            '### Forbidden actions',
            '### Required inputs',
            '### Required outputs',
            '### Handoff criteria',
            '### Tests before handoff',
            '### Human-approval gates'
          ];

          for (let index = 0; index < roles.length; index += 1) {
            const start = architecture.indexOf(`## ${index + 1}. ${roles[index]}`);
            const end = index + 1 < roles.length
              ? architecture.indexOf(`## ${index + 2}. ${roles[index + 1]}`)
              : architecture.indexOf('## Escalation rules');
            assert.ok(start >= 0 && end > start, `missing role contract: ${roles[index]}`);
            const section = architecture.slice(start, end);
            for (const field of requiredRoleFields) {
              assert.ok(section.includes(field), `${roles[index]} missing ${field}`);
            }
          }

          assert.ok(
            root.includes('Every agent updates the manifest and status report'),
            'universal manifest update duty missing from AGENTS.md'
          );
          for (const contract of [
            ['Supervisor manifest input', 'Read `data/content-manifest.json` before large content missions'],
            ['Scientific manifest input', '`scientific_review` value'],
            ['Scientific approval boundary', '`HUMAN_APPROVED` for its own work'],
            ['SEO/i18n manifest inputs', '`seo_review`, and `i18n_review` values'],
            ['QA manifest gate', 'content-manifest JSON, enums, content identity, routes, filesystem/sitemap parity, and status-report consistency']
          ]) {
            assert.ok(architecture.includes(contract[1]), `${contract[0]} missing from agent architecture`);
          }

          const scientific = fs.readFileSync('docs/SCIENTIFIC_STANDARD.md', 'utf8');
          for (const evidenceClass of [
            'Human randomized evidence',
            'Human observational evidence',
            'Preclinical evidence',
            'In vitro evidence',
            'Mechanistic evidence',
            'Theoretical evidence'
          ]) {
            assert.ok(scientific.includes(evidenceClass), `missing evidence class: ${evidenceClass}`);
          }

          const i18n = fs.readFileSync('docs/I18N_STANDARD.md', 'utf8');
          for (const status of ['COMPLETE', 'PARTIAL', 'SHELL', 'MISSING', 'REVIEW_REQUIRED']) {
            assert.ok(i18n.includes(status), `missing i18n status: ${status}`);
          }

          const pageContract = fs.readFileSync('docs/CONTENT_PAGE_CONTRACT.md', 'utf8');
          for (const pageType of ['## Molecule contract', '## Supplement contract', '## Biomarker contract']) {
            assert.ok(pageContract.includes(pageType), `missing page contract: ${pageType}`);
          }

          const roadmap = fs.readFileSync('docs/ROADMAP.md', 'utf8');
          for (let phase = 1; phase <= 6; phase += 1) {
            assert.ok(roadmap.includes(`## Phase ${phase} `), `missing roadmap phase ${phase}`);
          }

          console.log(`Validated ${requiredFiles.length} governance files and ${roles.length} role contracts.`);
          JS

      - name: Check JavaScript syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate content manifest integrity
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const manifest = JSON.parse(fs.readFileSync('data/content-manifest.json', 'utf8'));
          const locales = ['en', 'pt', 'es'];
          const allowedTypes = new Set([
            'home', 'hub', 'peptide', 'supplement', 'biomarker',
            'comparison', 'research', 'membership', 'other'
          ]);
          const allowedStatuses = new Set([
            'COMPLETE', 'PARTIAL', 'SHELL', 'MISSING', 'REVIEW_REQUIRED'
          ]);
          const allowedReviews = new Set(['REVIEW_REQUIRED', 'HUMAN_APPROVED', 'N/A']);
          const allowedPriorities = new Set(['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']);
          const productionBase = 'https://site-solutions-pro.github.io/wellmax/';
          const routeBase = '/wellmax/';

          assert.equal(manifest.version, 1, 'unsupported manifest version');
          assert.equal(manifest.repository, 'site-solutions-pro/wellmax', 'wrong manifest repository');
          assert.equal(manifest.production_base, productionBase, 'wrong manifest production base');
          assert.ok(Array.isArray(manifest.content_families), 'content_families must be an array');

          const visit = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            if (entry.name === '.git') return [];
            const target = path.join(directory, entry.name);
            if (entry.isDirectory()) return visit(target);
            return entry.isFile() && entry.name.endsWith('.html')
              ? [path.relative(root, target).replaceAll('\\', '/')]
              : [];
          });
          const htmlFiles = visit(root).sort();
          const htmlSet = new Set(htmlFiles);

          const routeToFile = (route) => {
            assert.ok(route.startsWith(routeBase), `route escapes ${routeBase}: ${route}`);
            let relative = route.slice(routeBase.length);
            if (!relative || relative.endsWith('/')) relative += 'index.html';
            return decodeURIComponent(relative);
          };
          const fileToRoute = (file) => {
            if (file === 'index.html') return routeBase;
            if (file === 'pt/index.html') return `${routeBase}pt/`;
            if (file === 'es/index.html') return `${routeBase}es/`;
            return `${routeBase}${file}`;
          };
          const localeFile = (locale, identity) => locale === 'en' ? identity : `${locale}/${identity}`;
          const identityFromFile = (file) => file.startsWith('pt/') || file.startsWith('es/')
            ? file.slice(3)
            : file;

          const sitemapXml = fs.readFileSync('sitemap.xml', 'utf8');
          const sitemapRoutes = [...sitemapXml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => {
            const url = match[1].trim();
            assert.ok(url.startsWith(productionBase), `sitemap URL outside production base: ${url}`);
            return `${routeBase}${url.slice(productionBase.length)}`;
          });
          assert.equal(new Set(sitemapRoutes).size, sitemapRoutes.length, 'duplicate sitemap routes');
          const sitemapSet = new Set(sitemapRoutes);

          const ids = new Set();
          const routes = new Set();
          const manifestFiles = new Set();
          const manifestSitemapRoutes = new Set();
          const familyByFile = new Map();

          for (const family of manifest.content_families) {
            for (const field of [
              'id', 'type', 'slug', 'title', 'routes', 'status', 'sitemap', 'linked',
              'scientific_review', 'seo_review', 'i18n_review', 'priority', 'notes'
            ]) {
              assert.ok(Object.hasOwn(family, field), `${family.id || '<unknown>'}: missing ${field}`);
            }
            assert.ok(typeof family.id === 'string' && family.id, 'family id must be non-empty');
            assert.ok(!ids.has(family.id), `duplicate content id: ${family.id}`);
            ids.add(family.id);
            assert.ok(allowedTypes.has(family.type), `${family.id}: invalid type ${family.type}`);
            assert.ok(typeof family.slug === 'string' && family.slug, `${family.id}: invalid slug`);
            assert.ok(typeof family.title === 'string' && family.title, `${family.id}: invalid title`);
            assert.ok(typeof family.notes === 'string', `${family.id}: notes must be a string`);
            assert.ok(allowedPriorities.has(family.priority), `${family.id}: invalid priority`);
            for (const field of ['scientific_review', 'seo_review', 'i18n_review']) {
              assert.ok(allowedReviews.has(family[field]), `${family.id}: invalid ${field}`);
            }

            const identities = new Set();
            for (const locale of locales) {
              assert.ok(Object.hasOwn(family.routes, locale), `${family.id}: missing routes.${locale}`);
              assert.ok(Object.hasOwn(family.status, locale), `${family.id}: missing status.${locale}`);
              assert.ok(Object.hasOwn(family.sitemap, locale), `${family.id}: missing sitemap.${locale}`);
              assert.ok(Object.hasOwn(family.linked, locale), `${family.id}: missing linked.${locale}`);
              assert.ok(allowedStatuses.has(family.status[locale]), `${family.id}: invalid ${locale} status`);
              assert.equal(typeof family.sitemap[locale], 'boolean', `${family.id}: sitemap.${locale} must be boolean`);
              assert.equal(typeof family.linked[locale], 'boolean', `${family.id}: linked.${locale} must be boolean`);

              const route = family.routes[locale];
              if (family.status[locale] === 'MISSING') {
                assert.equal(route, null, `${family.id}: MISSING ${locale} route must be null`);
                assert.equal(family.sitemap[locale], false, `${family.id}: MISSING ${locale} cannot be in sitemap`);
                assert.equal(family.linked[locale], false, `${family.id}: MISSING ${locale} cannot be linked`);
                continue;
              }
              assert.ok(typeof route === 'string', `${family.id}: ${locale} route must be a string`);
              assert.ok(!routes.has(route), `duplicate manifest route: ${route}`);
              routes.add(route);
              if (locale === 'en') {
                assert.ok(!route.startsWith('/wellmax/pt/') && !route.startsWith('/wellmax/es/'), `${family.id}: EN route has locale prefix`);
              } else {
                assert.ok(route.startsWith(`/wellmax/${locale}/`), `${family.id}: ${locale} route has wrong prefix`);
              }

              const file = routeToFile(route);
              assert.ok(htmlSet.has(file), `${family.id}: route target missing: ${route} -> ${file}`);
              manifestFiles.add(file);
              familyByFile.set(file, { family, locale });
              identities.add(identityFromFile(file));

              const inSitemap = sitemapSet.has(route);
              assert.equal(family.sitemap[locale], inSitemap, `${family.id}: sitemap.${locale} is stale`);
              if (inSitemap) manifestSitemapRoutes.add(route);

              const html = fs.readFileSync(file, 'utf8');
              const generatedShell = html.includes('assets/i18n-page.js');
              assert.equal(family.status[locale] === 'SHELL', generatedShell, `${family.id}: ${locale} shell status disagrees with renderer`);
            }
            assert.ok(identities.size <= 1, `${family.id}: locale routes do not preserve content identity`);
          }

          assert.deepEqual([...manifestFiles].sort(), htmlFiles, 'manifest and public HTML filesystem are out of sync');
          assert.deepEqual([...manifestSitemapRoutes].sort(), [...sitemapSet].sort(), 'manifest and sitemap are out of sync');
          assert.deepEqual([...routes].sort(), htmlFiles.map(fileToRoute).sort(), 'manifest route and filesystem route sets differ');

          const inbound = Object.fromEntries(htmlFiles.map((file) => [file, 0]));
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(/<a\b([^>]*?)href=["']([^"']+)["']([^>]*)>/gi)) {
              const attributes = `${match[1]}${match[3]}`;
              const href = match[2];
              if (/data-language=/i.test(attributes)) continue;
              if (/^(?:https?:|mailto:|tel:|javascript:|data:|#)/i.test(href)) continue;
              const clean = href.split(/[?#]/)[0];
              if (!clean) continue;
              let target;
              if (clean.startsWith(routeBase)) target = path.join(root, clean.slice(routeBase.length));
              else target = path.resolve(path.dirname(path.join(root, file)), clean);
              if (clean.endsWith('/')) target = path.join(target, 'index.html');
              const relative = path.relative(root, target).replaceAll('\\', '/');
              if (Object.hasOwn(inbound, relative)) inbound[relative] += 1;
            }
          }

          // assets/app.js supplies these non-language primary navigation links at runtime.
          for (const locale of locales) {
            for (const identity of ['index.html', 'explore.html', 'library.html', 'biomarkers.html', 'comparisons.html', 'membership.html']) {
              const target = localeFile(locale, identity);
              if (Object.hasOwn(inbound, target)) inbound[target] += 1;
            }
          }

          for (const [file, { family, locale }] of familyByFile) {
            assert.equal(family.linked[locale], inbound[file] > 0, `${family.id}: linked.${locale} is stale`);
          }

          const manifestStandard = fs.readFileSync('docs/CONTENT_MANIFEST_STANDARD.md', 'utf8');
          assert.ok(
            manifestStandard.includes('`docs/CONTENT_PAGE_CONTRACT.md` is the canonical publication and review contract'),
            'manifest standard does not defer to the canonical content-page contract'
          );

          const report = fs.readFileSync('docs/CONTENT_STATUS_REPORT.md', 'utf8');
          const pageCount = manifest.content_families.reduce(
            (total, family) => total + locales.filter((locale) => family.routes[locale] !== null).length,
            0
          );
          assert.ok(
            report.includes(`Total content families: **${manifest.content_families.length}**`),
            'status report family total is stale'
          );
          assert.ok(
            report.includes(`Total public pages represented: **${pageCount}**`),
            'status report page total is stale'
          );

          for (const status of allowedStatuses) {
            const counts = locales.map(
              (locale) => manifest.content_families.filter((family) => family.status[locale] === status).length
            );
            const total = counts.reduce((sum, count) => sum + count, 0);
            assert.ok(
              report.includes(`| ${status} | ${counts[0]} | ${counts[1]} | ${counts[2]} | ${total} |`),
              `status report locale totals are stale for ${status}`
            );
          }

          for (const type of allowedTypes) {
            const families = manifest.content_families.filter((family) => family.type === type);
            const pages = families.reduce(
              (total, family) => total + locales.filter((locale) => family.routes[locale] !== null).length,
              0
            );
            assert.ok(
              report.includes(`| ${type} | ${families.length} | ${pages} |`),
              `status report type totals are stale for ${type}`
            );
          }

          for (const priority of allowedPriorities) {
            const count = manifest.content_families.filter((family) => family.priority === priority).length;
            assert.ok(
              report.includes(`| ${priority} | ${count} |`),
              `status report priority total is stale for ${priority}`
            );
          }

          const reviewLabels = {
            scientific_review: 'scientific',
            seo_review: 'SEO',
            i18n_review: 'i18n'
          };
          for (const [field, label] of Object.entries(reviewLabels)) {
            const count = manifest.content_families.filter((family) => family[field] === 'REVIEW_REQUIRED').length;
            assert.ok(
              report.includes(`**${count}** families require ${label} review`),
              `status report review total is stale for ${field}`
            );
          }

          const actualBacklog = [...report.matchAll(/^\|\s*\d+\s*\|\s*`([^`]+)`\s*\|/gm)]
            .map((match) => match[1]);
          assert.equal(actualBacklog.length, 20, 'status report must contain exactly 20 HIGH backlog entries');
          assert.equal(new Set(actualBacklog).size, 20, 'status report top-20 HIGH backlog contains duplicates');
          const familiesById = new Map(manifest.content_families.map((family) => [family.id, family]));
          for (const id of actualBacklog) {
            assert.ok(familiesById.has(id), `status report backlog identity is absent from manifest: ${id}`);
            assert.equal(familiesById.get(id).priority, 'HIGH', `status report backlog identity is not HIGH: ${id}`);
          }

          console.log(`Validated ${manifest.content_families.length} content families, ${manifestFiles.size} manifest routes, ${htmlFiles.length} public HTML files and ${sitemapSet.size} sitemap routes.`);
          console.log('Validated status-report locale, type, review, priority and top-backlog consistency.');
          JS

      - name: Validate generated navigation paths
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const source = fs.readFileSync('assets/app.js', 'utf8');
          const repositoryPath = '/wellmax/';
          const cases = [
            ['/wellmax/', 'en', 'index.html'],
            ['/wellmax/index.html', 'en', 'index.html'],
            ['/wellmax/peptides/retatrutide.html', 'en', 'peptides/retatrutide.html'],
            ['/wellmax/biomarkers/hba1c.html', 'en', 'biomarkers/hba1c.html'],
            ['/wellmax/supplements/omega-3.html', 'en', 'supplements/omega-3.html'],
            ['/wellmax/pt/', 'pt', 'index.html'],
            ['/wellmax/pt/peptides/retatrutide.html', 'pt', 'peptides/retatrutide.html'],
            ['/wellmax/pt/biomarkers/hba1c.html', 'pt', 'biomarkers/hba1c.html'],
            ['/wellmax/pt/supplements/omega-3.html', 'pt', 'supplements/omega-3.html'],
            ['/wellmax/es/', 'es', 'index.html'],
            ['/wellmax/es/peptides/retatrutide.html', 'es', 'peptides/retatrutide.html'],
            ['/wellmax/es/biomarkers/hba1c.html', 'es', 'biomarkers/hba1c.html'],
            ['/wellmax/es/supplements/omega-3.html', 'es', 'supplements/omega-3.html']
          ];

          const pagePath = (locale, page) => {
            const prefix = locale === 'en' ? '' : `${locale}/`;
            return `${repositoryPath}${prefix}${page === 'index.html' ? '' : page}`;
          };

          for (const [pathname, locale, contentPath] of cases) {
            const header = { innerHTML: '' };
            const document = {
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/app.js' },
              querySelector: (selector) => selector === '.site-header' ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(source, { URL, document, window, HTMLAnchorElement: class {} });

            const actual = [...header.innerHTML.matchAll(/href="([^"]+)"/g)].map((match) => match[1]);
            const expected = [
              pagePath(locale, 'index.html'),
              pagePath(locale, 'explore.html'),
              pagePath(locale, 'library.html'),
              pagePath(locale, 'biomarkers.html'),
              pagePath(locale, 'comparisons.html'),
              pagePath(locale, 'membership.html'),
              pagePath('en', contentPath),
              pagePath('pt', contentPath),
              pagePath('es', contentPath)
            ];
            assert.deepEqual(actual, expected, `generated navigation mismatch for ${pathname}`);
            for (const href of actual) {
              assert.ok(href.startsWith(repositoryPath), `navigation escapes repository base: ${href}`);
              const relative = href.slice(repositoryPath.length);
              const target = relative === '' || relative.endsWith('/') ? `${relative}index.html` : relative;
              assert.ok(fs.existsSync(target), `generated navigation target missing: ${href} -> ${target}`);
            }
          }

          console.log(`Validated generated navigation for ${cases.length} root and nested locale paths.`);
          JS

      - name: Validate global language selector consistency
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const appSource = fs.readFileSync('assets/app.js', 'utf8');
          const i18nSource = fs.readFileSync('assets/i18n-page.js', 'utf8');
          const sharedCss = fs.readFileSync('assets/styles.css', 'utf8');
          const homepageCss = fs.readFileSync('assets/wellmax.css', 'utf8');
          const canonicalSvg = '<svg class="language-globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3C9.6 5.5 8.4 8.5 8.4 12S9.6 18.5 12 21"></path></svg>';
          const cases = [
            ['/wellmax/', 'en'],
            ['/wellmax/peptides/retatrutide.html', 'en'],
            ['/wellmax/biomarkers/hba1c.html', 'en'],
            ['/wellmax/supplements/omega-3.html', 'en'],
            ['/wellmax/pt/', 'pt'],
            ['/wellmax/pt/peptides/retatrutide.html', 'pt'],
            ['/wellmax/pt/biomarkers/hba1c.html', 'pt'],
            ['/wellmax/pt/supplements/omega-3.html', 'pt'],
            ['/wellmax/es/', 'es'],
            ['/wellmax/es/peptides/retatrutide.html', 'es'],
            ['/wellmax/es/biomarkers/hba1c.html', 'es'],
            ['/wellmax/es/supplements/omega-3.html', 'es']
          ];
          const shellCases = [
            ['pt/biomarkers.html', '/wellmax/pt/biomarkers.html', 'pt', 'biomarkers.html'],
            ['pt/comparisons.html', '/wellmax/pt/comparisons.html', 'pt', 'comparisons.html'],
            ['es/explore.html', '/wellmax/es/explore.html', 'es', 'explore.html'],
            ['es/library.html', '/wellmax/es/library.html', 'es', 'library.html'],
            ['es/biomarkers.html', '/wellmax/es/biomarkers.html', 'es', 'biomarkers.html'],
            ['es/comparisons.html', '/wellmax/es/comparisons.html', 'es', 'comparisons.html'],
            ['es/peptides/retatrutide.html', '/wellmax/es/peptides/retatrutide.html', 'es', 'peptides/retatrutide.html'],
            ['es/biomarkers/hba1c.html', '/wellmax/es/biomarkers/hba1c.html', 'es', 'biomarkers/hba1c.html'],
            ['es/supplements/omega-3.html', '/wellmax/es/supplements/omega-3.html', 'es', 'supplements/omega-3.html']
          ];

          for (const [pathname, locale] of cases) {
            const header = { innerHTML: '' };
            const document = {
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/app.js' },
              querySelector: (selector) => selector === '.site-header' ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(appSource, { URL, document, window, HTMLAnchorElement: class {} });
            assert.ok(header.innerHTML.includes(canonicalSvg), `non-canonical globe SVG for ${pathname}`);
            assert.match(header.innerHTML, /<button class="language-button"[^>]+aria-expanded="false"[^>]+aria-haspopup="true"[^>]+aria-label="[^"]+">/);
            assert.match(header.innerHTML, /<div class="language-dropdown" role="menu" hidden>/);
            assert.equal((header.innerHTML.match(/class="active"/g) || []).length, 1, `active language count for ${pathname}`);
            assert.match(header.innerHTML, new RegExp(`class="active" href="[^"]+" data-language="${locale}"`));
          }

          for (const [file, pathname, locale, contentPath] of shellCases) {
            const shell = fs.readFileSync(file, 'utf8');
            const dataset = Object.fromEntries(
              [...shell.matchAll(/data-([a-z0-9-]+)="([^"]+)"/g)]
                .map(([, key, value]) => [key.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()), value])
            );
            const stylesheetHref = shell.match(/<link[^>]+href="([^"]*assets\/styles\.css)"/)?.[1];
            assert.ok(stylesheetHref, `${file} does not load shared selector CSS`);
            assert.equal(
              new URL(stylesheetHref, `https://site-solutions-pro.github.io${pathname}`).pathname,
              '/wellmax/assets/styles.css',
              `${file} does not resolve to shared selector CSS`
            );
            assert.ok(shell.includes('assets/i18n-page.js'), `${file} does not use the shared i18n renderer`);
            assert.ok(!shell.includes('language-globe'), `${file} contains a page-specific globe`);
            assert.ok(!shell.includes('language-button'), `${file} contains a page-specific selector button`);

            const header = { innerHTML: '' };
            let rootMarkup = '';
            let appendedAppScript = null;
            const root = {};
            Object.defineProperty(root, 'innerHTML', {
              set(value) { rootMarkup = value; },
              get() { return rootMarkup; }
            });
            const document = {
              body: {
                dataset,
                append(node) { appendedAppScript = node; }
              },
              currentScript: { src: 'https://site-solutions-pro.github.io/wellmax/assets/i18n-page.js' },
              head: { append: () => {} },
              createElement: (tagName) => ({ tagName: tagName.toUpperCase() }),
              getElementById: (id) => id === 'i18n-root' ? root : null,
              querySelector: (selector) => selector === '.site-header' && rootMarkup.includes('class="site-header"') ? header : null,
              querySelectorAll: () => [],
              addEventListener: () => {}
            };
            const window = {
              location: { pathname },
              clearInterval: () => {},
              setInterval: () => 0,
              matchMedia: () => ({ matches: true })
            };

            vm.runInNewContext(i18nSource, { URL, document, window });
            assert.ok(appendedAppScript, `${file} did not invoke the app.js renderer`);
            assert.equal(
              new URL(appendedAppScript.src).pathname,
              '/wellmax/assets/app.js',
              `${file} invoked the wrong shared renderer`
            );
            document.currentScript = { src: appendedAppScript.src };
            vm.runInNewContext(appSource, { URL, document, window, HTMLAnchorElement: class {} });

            assert.ok(header.innerHTML.includes(canonicalSvg), `${file} runtime globe is not canonical`);
            assert.match(header.innerHTML, /<button class="language-button"[^>]+aria-expanded="false"[^>]+aria-haspopup="true"[^>]+aria-label="[^"]+">/);
            assert.match(header.innerHTML, /<div class="language-dropdown" role="menu" hidden>/);
            assert.equal((header.innerHTML.match(/class="active"/g) || []).length, 1, `${file} active language count`);
            assert.match(header.innerHTML, new RegExp(`class="active" href="[^"]+" data-language="${locale}"`));

            const languageLinks = Object.fromEntries(
              [...header.innerHTML.matchAll(/href="([^"]+)" data-language="(en|pt|es)"/g)]
                .map(([, href, language]) => [language, href])
            );
            assert.deepEqual(languageLinks, {
              en: `/wellmax/${contentPath}`,
              pt: `/wellmax/pt/${contentPath}`,
              es: `/wellmax/es/${contentPath}`
            }, `${file} does not preserve content identity across locales`);
          }

          const htmlFiles = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git') continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(target);
              if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(target);
            }
          };
          visit('.');

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const usesApp = /assets\/app\.js/.test(html);
            const usesI18nShell = /assets\/i18n-page\.js/.test(html);
            const usesPortalRenderer = /assets\/portal-i18n\.js/.test(html);
            assert.ok(usesApp || usesI18nShell || usesPortalRenderer, `${file} has no shared header renderer`);
            if (html.includes('data-language-menu')) {
              assert.ok(html.includes(canonicalSvg), `${file} contains non-canonical static globe markup`);
              assert.ok(html.includes('class="language-button"'), `${file} static selector lacks language-button`);
            }
          }

          assert.ok(i18nSource.includes("new URL('app.js',document.currentScript.src)"), 'i18n shell does not delegate to app.js');
          for (const selector of ['.language-menu', '.language-button', '.language-globe', '.language-dropdown']) {
            assert.ok(sharedCss.includes(selector), `shared selector CSS missing ${selector}`);
            assert.ok(!homepageCss.includes(selector), `homepage CSS still overrides ${selector}`);
          }

          console.log(`Validated the canonical language selector on ${cases.length} representative routes, ${shellCases.length} generated localized hubs and all ${htmlFiles.length} public HTML files.`);
          console.log('Explicitly validated pt/comparisons.html through i18n-page.js -> app.js with PT active and reciprocal identity links.');
          JS

