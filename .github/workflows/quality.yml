      - name: Validate Spanish and Portuguese locale routing
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const childProcess = require('node:child_process');

          const root = process.cwd();
          const localeFiles = (locale) => {
            const files = [];
            const visit = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const target = path.join(directory, entry.name);
                if (entry.isDirectory()) visit(target);
                if (entry.isFile() && entry.name.endsWith('.html')) files.push(target);
              }
            };
            visit(locale);
            return files.sort();
          };

          const audit = (locale, read) => {
            const escapes = [];
            for (const file of localeFiles(locale)) {
              const html = read(file);
              for (const match of html.matchAll(/<a\b([^>]*?)href=["']([^"']+)["']([^>]*)>/gi)) {
                const attributes = `${match[1]}${match[3]}`;
                const href = match[2];
                if (/data-language=/.test(attributes)) continue;
                if (/^(?:https?:|mailto:|tel:|javascript:|data:|#)/i.test(href)) continue;
                const clean = href.split(/[?#]/)[0];
                if (!clean) continue;
                let target = path.resolve(path.dirname(file), clean);
                if (clean.endsWith('/')) target = path.join(target, 'index.html');
                if (!target.startsWith(root)) continue;
                const relativeTarget = path.relative(root, target).replaceAll('\\', '/');
                if (relativeTarget.startsWith(`${locale}/`)) continue;
                const localizedTarget = path.join(root, locale, relativeTarget);
                if (fs.existsSync(localizedTarget)) {
                  escapes.push(`${file.replaceAll('\\', '/')}:${href}`);
                }
              }
            }
            return escapes.sort();
          };

          const currentReader = (file) => fs.readFileSync(file, 'utf8');
          const baseReader = (file) => childProcess.execFileSync(
            'git',
            ['show', `origin/${process.env.GITHUB_BASE_REF || 'main'}:${file.replaceAll('\\', '/')}`],
            { encoding: 'utf8' }
          );
          const spanishEscapes = audit('es', currentReader);
          const portugueseEscapes = audit('pt', currentReader);
          const baselinePortugueseEscapes = audit('pt', baseReader);

          assert.deepEqual(spanishEscapes, [], `Spanish pages escape their locale: ${spanishEscapes.join(', ')}`);
          assert.deepEqual(
            portugueseEscapes,
            baselinePortugueseEscapes,
            'Portuguese locale routing changed outside the approved Spanish fix'
          );

          const spanishHomepage = fs.readFileSync('es/index.html', 'utf8');
          assert.ok(spanishHomepage.includes('assets/app.js'), 'Spanish homepage does not load app.js');
          for (const page of [
            'explore.html',
            'library.html',
            'biomarkers.html',
            'comparisons.html',
            'membership.html',
            'peptides.html',
            'longevity.html',
            'metabolism.html',
            'performance.html',
            'neuroscience.html'
          ]) {
            assert.ok(!spanishHomepage.includes(`href="../${page}"`), `Spanish homepage escapes to English: ../${page}`);
          }

          console.log(`Validated locale routing across ${localeFiles('es').length} Spanish pages with zero localized-route escapes.`);
          console.log(`Confirmed Portuguese routing is regression-free against ${baselinePortugueseEscapes.length} pre-existing legacy escapes.`);
          JS

