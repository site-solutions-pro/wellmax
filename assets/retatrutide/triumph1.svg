<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">TRIUMPH-1 - perda média de peso em 80 semanas</title><desc id="d">Gráfico de barras com placebo 2,2%, 4 mg 19%, 9 mg 25,9% e 12 mg 28,3%.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16324a" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="#071421"/><rect width="1600" height="900" fill="url(#g)" opacity=".55"/><circle cx="60" cy="65" r="190" fill="#1aaed1"/><circle cx="1490" cy="830" r="185" fill="#8465ff"/><text x="115" y="118" fill="#72dff3" font-family="Arial,sans-serif" font-size="26" font-weight="700">TRIUMPH-1 • OBESIDADE SEM DIABETES</text><text x="115" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="800">Escala de dose e magnitude da perda de peso</text><text x="115" y="235" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="23">2.339 participantes • 80 semanas</text><rect x="115" y="295" width="920" height="470" rx="28" fill="#0d2035" stroke="#1e3b56"/><text x="155" y="345" fill="#c9d7e6" font-family="Arial,sans-serif" font-size="22" font-weight="700">PERDA MÉDIA EM 80 SEMANAS</text><line x1="190" y1="690" x2="965" y2="690" stroke="#36526d" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="230" y="650" width="110" height="40" rx="8" fill="#33485d"/><text x="285" y="625" fill="#fff" font-size="30" font-weight="800">2,2%</text><text x="285" y="735" fill="#9fb2c6" font-size="21">Placebo</text><rect x="430" y="415" width="110" height="275" rx="8" fill="#27cce3"/><text x="485" y="390" fill="#fff" font-size="30" font-weight="800">19,0%</text><text x="485" y="735" fill="#9fb2c6" font-size="21">4 mg</text><rect x="630" y="315" width="110" height="375" rx="8" fill="#8065ff"/><text x="685" y="290" fill="#fff" font-size="30" font-weight="800">25,9%</text><text x="685" y="735" fill="#9fb2c6" font-size="21">9 mg</text><rect x="830" y="275" width="110" height="415" rx="8" fill="#ff3f7d"/><text x="885" y="250" fill="#fff" font-size="30" font-weight="800">28,3%</text><text x="885" y="735" fill="#9fb2c6" font-size="21">12 mg</text></g><rect x="1080" y="310" width="390" height="170" rx="24" fill="#0d2035" stroke="#1e3b56"/><circle cx="1118" cy="350" r="8" fill="#ff3f7d"/><text x="1140" y="360" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Resposta profunda • 12 mg</text><text x="1118" y="405" fill="#b6c7d9" font-family="Arial,sans-serif" font-size="20"><tspan x="1118">62,5% ≥25% • 45,3% ≥30%</tspan><tspan x="1118" dy="32">27,2% ≥35%</tspan></text><rect x="1080" y="505" width="390" height="150" rx="24" fill="#0d2035" stroke="#1e3b56"/><circle cx="1118" cy="545" r="8" fill="#27cce3"/><text x="1140" y="554" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Extensão selecionada</text><text x="1118" y="600" fill="#b6c7d9" font-family="Arial,sans-serif" font-size="20"><tspan x="1118">Até −30,3% em 104 semanas</tspan><tspan x="1118" dy="30">em subgrupo selecionado.</tspan></text></svg>