<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Eventos adversos comuns no TRIUMPH-1</title><desc id="d">Gráfico de barras do braço de 12 mg com náusea 42,4%, diarreia 32%, constipação 26,1%, vômitos 25,3%, disestesia 12,5% e IVAS 13,1%.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16324a" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="#071421"/><rect width="1600" height="900" fill="url(#g)" opacity=".55"/><circle cx="60" cy="60" r="190" fill="#1aaed1"/><circle cx="1490" cy="830" r="185" fill="#8465ff"/><text x="115" y="118" fill="#72dff3" font-family="Arial,sans-serif" font-size="26" font-weight="700">SEGURANÇA • TRIUMPH-1</text><text x="115" y="188" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="800">O custo de tolerabilidade aumenta com a dose</text><text x="115" y="235" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="22">Braço de 12 mg • incidência observada</text><rect x="115" y="295" width="940" height="470" rx="28" fill="#0d2035" stroke="#1e3b56"/><line x1="180" y1="690" x2="995" y2="690" stroke="#36526d" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="215" y="320" width="90" height="370" rx="8" fill="#ff3f7d"/><text x="260" y="295" fill="#fff" font-size="27" font-weight="800">42,4%</text><text x="260" y="735" fill="#9fb2c6" font-size="18">Náusea</text><rect x="350" y="410" width="90" height="280" rx="8" fill="#27cce3"/><text x="395" y="385" fill="#fff" font-size="27" font-weight="800">32%</text><text x="395" y="735" fill="#9fb2c6" font-size="18">Diarreia</text><rect x="485" y="462" width="90" height="228" rx="8" fill="#8065ff"/><text x="530" y="437" fill="#fff" font-size="27" font-weight="800">26,1%</text><text x="530" y="735" fill="#9fb2c6" font-size="18">Constip.</text><rect x="620" y="469" width="90" height="221" rx="8" fill="#ffb650"/><text x="665" y="444" fill="#fff" font-size="27" font-weight="800">25,3%</text><text x="665" y="735" fill="#9fb2c6" font-size="18">Vômitos</text><rect x="755" y="580" width="90" height="110" rx="8" fill="#ff6f8d"/><text x="800" y="555" fill="#fff" font-size="27" font-weight="800">12,5%</text><text x="800" y="735" fill="#9fb2c6" font-size="18">Disestesia</text><rect x="890" y="575" width="90" height="115" rx="8" fill="#4be0a8"/><text x="935" y="550" fill="#fff" font-size="27" font-weight="800">13,1%</text><text x="935" y="735" fill="#9fb2c6" font-size="18">IVAS</text></g><rect x="1090" y="320" width="390" height="170" rx="24" fill="#0d2035" stroke="#1e3b56"/><text x="1130" y="365" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Padrão temporal</text><text x="1130" y="410" fill="#b6c7d9" font-family="Arial,sans-serif" font-size="20"><tspan x="1130">Sintomas GI ocorreram sobretudo</tspan><tspan x="1130" dy="30">durante a escalada de dose.</tspan></text><rect x="1090" y="520" width="390" height="170" rx="24" fill="#0d2035" stroke="#1e3b56"/><text x="1130" y="565" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Impacto prático</text><text x="1130" y="610" fill="#b6c7d9" font-family="Arial,sans-serif" font-size="20"><tspan x="1130">11,3% descontinuaram por eventos</tspan><tspan x="1130" dy="30">adversos no braço de 12 mg.</tspan></text></svg>