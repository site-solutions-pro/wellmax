<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">O circuito triplo da retatrutida</title><desc id="d">Diagrama dos receptores GLP-1R, GIPR e GCGR e do resultado metabólico integrado.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16324a" stroke-width="1"/></pattern><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#091a2b"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><rect width="1600" height="900" fill="url(#g)" opacity=".55"/><circle cx="68" cy="68" r="190" fill="#1aaed1" opacity=".9"/><circle cx="1490" cy="820" r="180" fill="#8465ff"/><text x="120" y="125" fill="#72dff3" font-family="Arial,sans-serif" font-size="26" font-weight="700">ARQUITETURA FUNCIONAL</text><text x="120" y="195" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">O circuito triplo</text><text x="120" y="242" fill="#a9bdd2" font-family="Arial,sans-serif" font-size="24">Três receptores, uma resposta metabólica integrada.</text><line x1="410" y1="435" x2="1190" y2="435" stroke="#304b65" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="410" cy="435" r="94" fill="none" stroke="#24d6ea" stroke-width="6"/><circle cx="410" cy="435" r="24" fill="#24d6ea"/><text x="410" y="575" fill="#fff" font-size="30" font-weight="700">GLP-1R</text><text x="410" y="615" fill="#9db2c8" font-size="20"><tspan x="410" dy="0">Saciedade, menor ingestão,</tspan><tspan x="410" dy="28">esvaziamento gástrico e glicemia</tspan></text><circle cx="800" cy="435" r="94" fill="none" stroke="#8065ff" stroke-width="6"/><circle cx="800" cy="435" r="24" fill="#8065ff"/><text x="800" y="575" fill="#fff" font-size="30" font-weight="700">GIPR</text><text x="800" y="615" fill="#9db2c8" font-size="20"><tspan x="800" dy="0">Integração incretínica</tspan><tspan x="800" dy="28">e controle metabólico</tspan></text><circle cx="1190" cy="435" r="94" fill="none" stroke="#ff3f7d" stroke-width="6"/><circle cx="1190" cy="435" r="24" fill="#ff3f7d"/><text x="1190" y="575" fill="#fff" font-size="30" font-weight="700">GCGR</text><text x="1190" y="615" fill="#9db2c8" font-size="20"><tspan x="1190" dy="0">Fluxo energético e</tspan><tspan x="1190" dy="28">oxidação de substratos</tspan></text></g><rect x="430" y="705" width="740" height="110" rx="24" fill="#0b3140" stroke="#24d6ea" stroke-width="2"/><text x="800" y="748" fill="#fff" font-family="Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="700">RESULTADO INTEGRADO</text><text x="800" y="790" fill="#5ce2d0" font-family="Arial,sans-serif" text-anchor="middle" font-size="24">↓ apetite • ↓ gordura ectópica • ↓ glicemia • ↑ gasto energético potencial</text></svg>